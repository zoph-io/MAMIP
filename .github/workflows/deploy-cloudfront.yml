name: Deploy Website to CloudFront

on:
  push:
    branches:
      - main
    paths:
      - "policies/**"
      - "website/**"
      - "data/**"
      - "findings/**"
      - "DEPRECATED.json"
      - "policies-list.json"
      - ".github/workflows/deploy-cloudfront.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# A newer bot commit supersedes an in-flight deploy; each deploy is a full,
# idempotent rebuild so cancelling mid-run is safe (S3 upload is content-diffed).
concurrency:
  group: deploy-website
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-1
  S3_BUCKET: iamtrail.com
  CLOUDFRONT_DISTRIBUTION_ID: E2R2N8OZK7U78U  # TODO: Update after Terraform creates new distribution for iamtrail.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git operations

      - name: Configure AWS credentials
        # Must run before generate-data so usage-stats (DynamoDB + CloudWatch in eu-west-1 / eu-west-3) can refresh. If the role cannot read those APIs, the generator keeps the last committed public/data/usage-stats.json.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_TO_ASSUME }}
          role-session-name: GH-Actions-IAMTrail-Website-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: ./website
        run: npm ci

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: website/.next/cache
          key: nextjs-${{ hashFiles('website/package-lock.json') }}-${{ hashFiles('website/app/**', 'website/components/**', 'website/lib/**') }}
          restore-keys: |
            nextjs-${{ hashFiles('website/package-lock.json') }}-

      - name: Rebuild first-seen action registry and change deltas
        # Full replay of the archive, ~3s. Keeps the discoveries page, the action
        # first-seen dates and the per-commit action deltas the RSS feeds render
        # current, instead of serving whatever was last committed.
        #
        # --sync then reconciles the DynamoDB table the notification Lambdas read,
        # which they cannot rebuild themselves. Without it the table is only ever
        # populated by hand, and it went unseeded for eleven days after launch while
        # every channel reported quiet weeks. Writes only the rows that are missing
        # or that a Lambda claimed live with approximate metadata, so a normal deploy
        # writes a handful. Needs the fetch-depth: 0 checkout and the credentials
        # configured above; boto3 is not on the runner image.
        run: |
          python3 -m pip install --quiet --disable-pip-version-check boto3
          python3 automation/scripts/build_action_registry.py --sync iamtrail-action-registry

      - name: Generate policy data
        working-directory: ./website
        run: npm run generate-data

      - name: Cache per-policy OG images
        uses: actions/cache@v4
        with:
          path: |
            website/public/policies
            website/.og-manifest.json
          key: og-images-${{ github.sha }}
          restore-keys: |
            og-images-

      - name: Generate OG images (incremental)
        working-directory: ./website
        run: npm run generate-og

      - name: Build Next.js site
        working-directory: ./website
        run: npm run build
        env:
          NEXT_PUBLIC_USE_BASE_PATH: "false" # Custom domain, no basePath

      - name: Deploy to S3 (content-diff, changed files only)
        working-directory: ./website
        run: |
          node scripts/deploy-s3.mjs \
            --bucket ${{ env.S3_BUCKET }} \
            --invalidation-manifest invalidation.json

      # Only the immutable objects that actually changed. Every HTML, JSON and
      # XML file is served "max-age=0, must-revalidate", so CloudFront already
      # revalidates it against S3 and the old blanket "/*" flushed the whole
      # edge cache thirteen times a day for nothing. deploy-s3.mjs falls back to
      # a wildcard when enough immutable objects changed to make naming them
      # more expensive than the wildcard, which bills as a single path.
      - name: Invalidate changed CloudFront paths
        working-directory: ./website
        run: |
          paths=$(jq -r '.paths | join(" ")' invalidation.json)
          if [ -z "$paths" ]; then
            echo "No immutable objects changed; nothing to invalidate."
            exit 0
          fi
          echo "Invalidating: $paths"
          # $paths is deliberately unquoted so it splits into one argument per
          # path, but the fallback value is "/*" and the shell would expand that
          # against the filesystem into /bin /etc /usr and so on.
          set -f
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths $paths

      - name: Deployment summary
        run: |
          echo "✅ Website deployed successfully!"
          echo "🌐 URL: https://iamtrail.com"
          echo "📦 S3 Bucket: s3://${{ env.S3_BUCKET }}"
          echo "☁️  CloudFront Distribution: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}"
          echo "🔄 Cache invalidated"
